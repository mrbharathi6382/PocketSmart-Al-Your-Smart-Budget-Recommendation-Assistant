{% extends "base.html" %}{% block title %}Register · PocketSmart AI{% endblock %}{% block content %}<div class="auth-card"><h1>Create account</h1><p>Your recommendation history is linked to your account.</p><form id="register-form"><label>Full name<input name="full_name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="button">Create account</button><p id="form-message" class="message"></p></form><p>Already registered? <a href="/login">Login</a></p></div>{% endblock %}{% block scripts %}<script>document.getElementById("register-form").addEventListener("submit",async e=>{e.preventDefault();const r=await api("/register",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok){setToken(r.data.access_token);location.href="/dashboard"}else showMessage(r.data.detail||"Registration failed")});</script>{% endblock %}
