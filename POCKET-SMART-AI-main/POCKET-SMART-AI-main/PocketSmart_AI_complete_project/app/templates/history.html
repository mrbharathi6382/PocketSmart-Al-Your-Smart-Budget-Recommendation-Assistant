{% extends "base.html" %}{% block title %}History · PocketSmart AI{% endblock %}{% block content %}<div class="page-head"><span class="eyebrow">HISTORY</span><h1>Recommendation history</h1><p>Review your saved planning sessions.</p></div><section class="card"><div id="history-list" class="list">Loading…</div></section>{% endblock %}{% block scripts %}<script>(async()=>{const r=await api("/history"),el=document.getElementById("history-list");if(!r.ok){el.textContent=r.data.detail||"Could not load history";return}if(!r.data.length){el.innerHTML="<p>No recommendations yet.</p>";return}el.innerHTML=r.data.map(x=>`<a class="history-row" href="/recommendations/${x.id}"><strong>${escapeHtml(x.planner_type.toUpperCase())}</strong><span>${new Date(x.created_at).toLocaleString()}</span><span class="pill">${escapeHtml(x.source)}</span></a>`).join("")})();</script>{% endblock %}
