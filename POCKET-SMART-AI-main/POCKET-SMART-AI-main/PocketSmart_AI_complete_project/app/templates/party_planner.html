{% extends "base.html" %}{% block title %}Party Planner · PocketSmart AI{% endblock %}{% block content %}<div class="form-page"><div class="page-head"><span class="eyebrow">EVENT PLANNING</span><h1>Party Budget Planner</h1><p>Balance food, venue, decoration and a contingency reserve.</p></div><form id="party-form" class="card planner-form"><label>Total budget<input name="budget" type="number" min="1" step="0.01" required></label><label>Currency<input name="currency" value="INR"></label><label>Guest count<input name="guest_count" type="number" min="1" required></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family Gathering</option><option>Other</option></select></label><label>Venue / city<input name="venue" placeholder="Coimbatore"></label><label>Preferences<textarea name="preferences" placeholder="Vegetarian food, simple decoration"></textarea></label><button class="button">Generate plan</button><p id="form-message" class="message"></p></form></div>{% endblock %}{% block scripts %}<script>document.getElementById("party-form").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target),r=await api("/generate-party",{method:"POST",body:JSON.stringify({budget:Number(f.get("budget")),currency:f.get("currency"),guest_count:Number(f.get("guest_count")),event_type:f.get("event_type"),venue:f.get("venue"),preferences:f.get("preferences")})});if(r.ok)location.href="/recommendations/"+r.data.id;else showMessage(r.data.detail||"Could not generate plan")});</script>{% endblock %}
