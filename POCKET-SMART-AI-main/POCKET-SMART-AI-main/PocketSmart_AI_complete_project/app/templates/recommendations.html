{% extends "base.html" %}{% block title %}Recommendations · PocketSmart AI{% endblock %}{% block content %}<div id="recommendations" data-id="{{ recommendation_id }}"><div class="page-head"><span class="eyebrow">AI RECOMMENDATIONS</span><h1>Loading your plan…</h1></div></div>{% endblock %}{% block scripts %}<script>(async()=>{const id=document.getElementById("recommendations").dataset.id,r=await api("/recommendations-details/"+id),el=document.getElementById("recommendations");if(!r.ok){el.innerHTML=`<div class="card"><h2>Could not load recommendation</h2><p>${escapeHtml(r.data.detail||"Unknown error")}</p></div>`;return}const x=r.data.result;el.innerHTML=`<div class="page-head"><span class="eyebrow">${escapeHtml(x.source.toUpperCase())}</span><h1>${escapeHtml(x.title)}</h1><p>${escapeHtml(x.summary)}</p></div><section class="stats"><div class="stat"><span>Budget</span><strong>${money(x.budget,x.currency)}</strong></div><div class="stat"><span>Estimated</span><strong>${money(x.total_estimated,x.currency)}</strong></div><div class="stat"><span>Remaining</span><strong>${money(x.remaining_budget,x.currency)}</strong></div></section><section class="card"><div class="section-title"><h2>Budget allocation</h2></div><div class="grid two">${x.budget_allocations.map(a=>`<div class="allocation"><strong>${escapeHtml(a.category)}</strong><span>${a.percentage}% · ${money(a.amount,x.currency)}</span><small>${escapeHtml(a.note)}</small></div>`).join("")}</div></section><section><div class="section-title"><h2>Recommendations</h2></div><div class="grid two">${x.recommendations.map(i=>`<article class="card"><span class="pill">${escapeHtml(i.priority)}</span><h3>${escapeHtml(i.name)}</h3><p>${escapeHtml(i.reason)}</p><strong>${money(i.estimated_price,i.currency)}</strong><p class="muted">${escapeHtml(i.platform)} · ${escapeHtml(i.category)}</p><a class="button small" target="_blank" rel="noopener noreferrer" href="${escapeAttr(i.search_url)}">Search on ${escapeHtml(i.platform)}</a></article>`).join("")}</div></section><section class="card"><h2>Tips</h2><ul>${x.tips.map(t=>`<li>${escapeHtml(t)}</li>`).join("")}</ul></section>`})();</script>{% endblock %}
