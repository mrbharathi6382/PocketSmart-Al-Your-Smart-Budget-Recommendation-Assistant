{% extends "base.html" %}{% block title %}Login · PocketSmart AI{% endblock %}{% block content %}<div class="auth-card"><h1>Welcome back</h1><p>Sign in to continue your planning.</p><form id="login-form"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="button">Login</button><p id="form-message" class="message"></p></form><p>New here? <a href="/register">Create an account</a></p></div>{% endblock %}{% block scripts %}<script>document.getElementById("login-form").addEventListener("submit",async e=>{e.preventDefault();const r=await api("/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok){setToken(r.data.access_token);location.href="/dashboard"}else showMessage(r.data.detail||"Login failed")});</script>{% endblock %}
