{% extends "base.html" %}{% block title %}Home Planner · PocketSmart AI{% endblock %}{% block content %}<div class="form-page"><div class="page-head"><span class="eyebrow">HOME INTERIOR</span><h1>Home Budget Planner</h1><p>Split your budget across the rooms and priorities that matter.</p></div><form id="home-form" class="card planner-form"><label>Total budget<input name="budget" type="number" min="1" step="0.01" required></label><label>Currency<input name="currency" value="INR" maxlength="5"></label><label>Preferences<textarea name="preferences" placeholder="Warm modern, space-saving, neutral colors"></textarea></label><div><div class="section-title"><h3>Rooms</h3><button type="button" class="button secondary small" onclick="addRoom()">+ Add room</button></div><div id="rooms"></div></div><button class="button">Generate plan</button><p id="form-message" class="message"></p></form></div>{% endblock %}{% block scripts %}<script>let roomIndex=0;function addRoom(type="Living Room"){const w=document.createElement("div");w.className="room-row";w.innerHTML=`<input name="room_type_${roomIndex}" value="${type}" placeholder="Room type" required><input name="quantity_${roomIndex}" type="number" value="1" min="1" max="50" required><input name="notes_${roomIndex}" placeholder="Notes"><button type="button" class="icon-button" onclick="this.parentElement.remove()">×</button>`;document.getElementById("rooms").appendChild(w);roomIndex++}addRoom();addRoom("Bedroom");document.getElementById("home-form").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target),rooms=[];for(const [k,v] of f.entries())if(k.startsWith("room_type_")){const i=k.split("_").pop();rooms.push({room_type:v,quantity:Number(f.get("quantity_"+i)),notes:f.get("notes_"+i)||""})}const r=await api("/generate-home",{method:"POST",body:JSON.stringify({budget:Number(f.get("budget")),currency:f.get("currency"),preferences:f.get("preferences"),rooms})});if(r.ok)location.href="/recommendations/"+r.data.id;else showMessage(r.data.detail||"Could not generate plan")});</script>{% endblock %}
