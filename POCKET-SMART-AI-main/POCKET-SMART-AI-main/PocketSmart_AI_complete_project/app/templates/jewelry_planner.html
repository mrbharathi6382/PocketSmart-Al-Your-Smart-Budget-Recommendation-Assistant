{% extends "base.html" %}{% block title %}Jewelry Planner · PocketSmart AI{% endblock %}{% block content %}<div class="form-page"><div class="page-head"><span class="eyebrow">JEWELRY PLANNING</span><h1>Jewelry Budget Planner</h1><p>Add an outfit image when Gemini is enabled to improve visible color/style matching.</p></div><form id="jewelry-form" class="card planner-form" enctype="multipart/form-data"><label>Total budget<input name="budget" type="number" min="1" step="0.01" required></label><label>Currency<input name="currency" value="INR"></label><label>Occasion<input name="occasion" placeholder="Wedding / Festival / Party" required></label><label>Style<input name="style" placeholder="Minimal, traditional, statement"></label><label>Outfit description<textarea name="outfit_description"></textarea></label><label>Outfit image<input name="outfit_image" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"></label><button class="button">Generate plan</button><p id="form-message" class="message"></p></form></div>{% endblock %}{% block scripts %}<script>document.getElementById("jewelry-form").addEventListener("submit",async e=>{e.preventDefault();const r=await api("/generate-jewelry",{method:"POST",body:new FormData(e.target)});if(r.ok)location.href="/recommendations/"+r.data.id;else showMessage(r.data.detail||"Could not generate plan")});</script>{% endblock %}
